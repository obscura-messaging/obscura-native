name: Kotlin

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: kotlin-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: kotlin

jobs:
  # Fast PR gate. No network, no live server. <30s.
  # Compiles main + runs the pure-logic unit suite + smoke-publishes to
  # mavenLocal so we know pix's resolution path still works.
  lib-unit:
    name: Lib (unit tests + publish)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: extractions/setup-just@v4

      - uses: actions/setup-java@v6.0.0
        with:
          distribution: 'temurin'
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6.3.0

      - uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint client protocol
        run: just --justfile ../justfile protocol-lint

      - name: Validate client protocol vectors
        run: just --justfile ../justfile protocol-vectors

      # Keep the unit suite, both coverage reports, the coverage floor, and
      # publication smoke test in one Gradle process to avoid four JVM starts.
      - name: Unit tests, coverage, and publish
        run: just --justfile ../justfile kotlin-ci

      - name: Upload unit-test report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: lib-unit-test-report
          path: kotlin/lib/build/reports/tests/test/
          retention-days: 7

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lib-coverage-report
          path: |
            kotlin/lib/build/reports/kover/html/
            kotlin/lib/build/reports/kover/report.xml
          retention-days: 14

  # Server-dependent scenario suite (256 tests) against a CONTAINERIZED
  # obscura-server (latest GHCR image) instead of live prod — so it's
  # isolated, and safe to run on every PR (no rate limits, no prod pollution).
  # OBSCURA_TEST_API points the tests at the local container.
  lib-integration:
    name: Lib (integration tests, containerized server)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: extractions/setup-just@v4

      - uses: actions/setup-java@v6.0.0
        with:
          distribution: 'temurin'
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6.3.0

      - name: Start obscura-server (latest prebuilt image)
        run: |
          # Clone only for docker-compose.yml (services + env); the server
          # itself comes prebuilt from GHCR — no Rust build in CI.
          git clone --depth 1 https://github.com/obscura-messaging/obscura-server /tmp/obscura-server
          cd /tmp/obscura-server
          cat > compose.ci.yml <<'EOF'
          services:
            obscura-server:
              image: ghcr.io/obscura-messaging/obscura-server:latest
              pull_policy: always
              environment:
                # Prod runs 3 load-balanced instances (~3x effective limits); this
                # single container would rate-limit the 230-test suite partway
                # through. Rate limiting isn't under test here — effectively disable.
                OBSCURA_RATE_LIMIT_PER_SECOND: 1000
                OBSCURA_RATE_LIMIT_BURST: 2000
                OBSCURA_RATE_LIMIT_AUTH_PER_SECOND: 1000
                OBSCURA_RATE_LIMIT_AUTH_BURST: 2000
          EOF
          docker compose -f docker-compose.yml -f compose.ci.yml up -d --wait
          # The server never creates its S3 bucket (no create_bucket in source);
          # prod's bucket was provisioned out-of-band. Fresh MinIO needs it made.
          AWS_ACCESS_KEY_ID=minioadmin AWS_SECRET_ACCESS_KEY=minioadmin \
            aws --endpoint-url http://localhost:9000 --region us-east-1 \
            s3api create-bucket --bucket test-bucket

      - name: Wait for server ready
        run: |
          for i in $(seq 1 60); do
            if curl -s -o /dev/null http://localhost:3000/; then echo "server up"; exit 0; fi
            sleep 5
          done
          echo "server did not become ready" >&2
          (cd /tmp/obscura-server && docker compose logs obscura-server | tail -50)
          exit 1

      - name: Integration tests
        env:
          OBSCURA_TEST_API: http://localhost:3000
          # Client-side pacing exists for prod rate limits; the local container
          # has them disabled, so drop the 500ms-per-auth-call sleep.
          AUTH_REQUEST_DELAY_MS: 0
        run: just --justfile ../justfile kotlin-integration http://localhost:3000

      - name: Upload integration-test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lib-integration-test-report
          path: kotlin/lib/build/reports/tests/integrationTest/
          retention-days: 14
