// Obscura client content protocol (v1)
//
// The client-to-client payload carried inside the server transport's encrypted
// bytes. The server never parses this layer.
//
// Behavioral contract: docs/KIT_API.md and protocol/conformance/.

syntax = "proto3";
package obscura.client.v1;

message EncryptedMessage {
  enum Type {
    TYPE_UNSPECIFIED = 0;
    TYPE_PREKEY_MESSAGE = 1;
    TYPE_ENCRYPTED_MESSAGE = 2;
  }
  Type type = 1;
  bytes content = 2;
}

message ClientMessage {
  uint64 timestamp = 1;

  oneof payload {
    FriendRequest friend_request = 2;
    FriendAccept friend_accept = 3;
    DeviceLinkApproval device_link_approval = 4;
    DeviceAnnounce device_announce = 5;
    AppEntry app_entry = 6;
    TypingSignal typing_signal = 7;
  }
}

message FriendRequest {
  string username = 1;
}

message FriendAccept {}

message DeviceInfo {
  string id = 1;
  string name = 2;
}

message DeviceLinkApproval {
  bytes challenge_response = 1;
  repeated DeviceInfo own_devices = 2;
  bytes friends_export = 3;
}

message DeviceAnnounce {
  repeated DeviceInfo devices = 1;
}

message AppEntry {
  string model = 1;
  string id = 2;
  uint64 timestamp = 3;
  bytes data = 4;
}

enum TypingState {
  TYPING_STATE_UNSPECIFIED = 0;
  TYPING_STATE_STARTED = 1;
  TYPING_STATE_STOPPED = 2;
}

message TypingSignal {
  string context_id = 1;
  TypingState state = 2;
}
